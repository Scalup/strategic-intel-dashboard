name: Update Strategic Feed

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser feedgen pytz beautifulsoup4 requests

      - name: Run feed generator
        run: python feed_generator.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add strategic-feed.xml
          git diff --quiet && git commit -m "Auto-update feed: $(date +'%Y-%m-%d %H:%M') CET" || echo "No changes to commit"
          git push
